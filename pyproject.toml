[project]
name = "team-churn-api"
version = "0.1.0"
description = "A containerised churn API service. Group 5's project"
readme = "README.md"
authors = [
    { name = "Reginald Erzoah", email = "reginalderzoah10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "ucimlrepo>=0.0.7",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.setuptools.packages.find]
include = ["api*"]